{% extends "home.html" %}
{% block content %}
    <br>
    <br>
    <br>
    {% comment %} <h1 class="h3 mb-3 fw-normal">请登录</h1> {% endcomment %}
    <h2 class="mb-4">请登录</h2>
    {% if form.errors %}
            <div class="alert alert-danger" role="alert">
                用户名或密码错误。
            </div>
    {% endif %}
  <form action="" method="post" class="border p-4 rounded shadow-sm">
    {% csrf_token %}
    <div class="mb-3">
        <label for="idcard" class="form-label">身份证号</label>
        <input type="text" class="form-control" id="idcard" name="idcard" placeholder="请输入身份证号" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">密码</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
    </div>
    <div class="form-check text-start my-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
        <label class="form-check-label" for="flexCheckDefault">
            记住我
        </label>
    </div>
    <button type="submit" class="btn btn-primary w-100">登录</button>
</form>
<p class="mt-3 text-center">没有账户？去<a href="{% url 'patient_create' %}">注册</a></p>


{% endblock content %}
