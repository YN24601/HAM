{% extends "home.html" %}
{% block content %}

    {% comment %} <h1 class="h3 mb-3 fw-normal">请登录</h1> {% endcomment %}
    <h2 class="mb-4">请登录</h2>
    {% if form.errors %}
            <div class="alert alert-danger" role="alert">
                用户名或密码错误。
            </div>
    {% endif %}

    <form action="" method="post" class="mb-3">
    <div class="mb-3">
      <label for="idcard" class="form-label">身份证号</label>
      <input class="form-control" id="idInput">
    </div>
    <div class="mb-3">
        <label for="password">密码</label>
        <input type="password" class="form-control" id="idPassword">
    </div>
    <div class="form-check text-start my-3">
      <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
      <label class="form-check-label" for="flexCheckDefault">
        记住我
      </label>
    </div>
    <button type="submit" class="btn btn-primary">登录</button>
    </form>
  <p class="mt-3">没有账户？去<a href="{% url 'patient_create' %}">注册</a></p>




{% endblock content %}
