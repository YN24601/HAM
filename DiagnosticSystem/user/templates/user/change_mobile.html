{% extends "user/patient_home.html" %}
{% load static %}
{% block content %}
<main>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- 修改手机号卡片 -->
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">修改手机号</h4>
                    </div>
                    <div class="card-body">
                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">当前手机号</label>
                                <input type="text" class="form-control" value="{{ patient.mobile }}" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="new_mobile" class="form-label">新手机号</label>
                                <input type="text" class="form-control" id="new_mobile" name="new_mobile" placeholder="请输入新手机号" required>
                            </div>
                            <div class="mb-3">
                                <label for="sms_code" class="form-label">短信验证码</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="sms_code" name="sms_code" placeholder="请输入验证码" required>
                                    <button type="button" class="btn btn-outline-secondary" id="send-code-btn">发送验证码</button>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 确认修改
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .card { border-radius: 15px; }
        .form-label { font-weight: 500; color: #495057; }
        .bg-light { background-color: #f8f9fa!important; }
    </style>

    <script>
        document.getElementById("send-code-btn").addEventListener("click", function() {
            const newMobile = document.getElementById("new_mobile").value;
            
            if (!newMobile) {
                alert("请输入新手机号");
                return;
            }
            
            // 验证手机号格式
            if (!/^1[3-9]\d{9}$/.test(newMobile)) {
                alert("手机号格式不正确");
                return;
            }
            
            fetch(`{% url 'send_verification_code_for_change_mobile' %}?new_mobile=${newMobile}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.message);
                } else {
                    alert(data.message || "发送验证码失败");
                }
            })
            .catch(error => {
                alert("发送验证码失败");
            });
        });
    </script>
</main>
{% endblock content %}
