{% extends "doctor/doctor_home.html" %}
{% load static %}
{% block content %}
<main>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- 修改密码卡片 -->
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">修改密码</h4>
                    </div>
                    <div class="card-body">
                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="sms_code" class="form-label">短信验证码</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="sms_code" name="sms_code" placeholder="请输入验证码" required>
                                    <button type="button" class="btn btn-outline-secondary" id="send-code-btn">发送验证码</button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="new_password" class="form-label">新密码</label>
                                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="请输入新密码" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">确认新密码</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="请再次输入新密码" required>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 确认修改
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 保持统一的样式 -->
    <style>
        .card { border-radius: 15px; }
        .form-label { font-weight: 500; color: #495057; }
        .bg-light { background-color: #f8f9fa!important; }
    </style>

    <!-- AJAX调用发送验证码接口 -->
    <script>
        document.getElementById("send-code-btn").addEventListener("click", function() {
            fetch("{% url 'send_verification_code' %}")
            .then(response => response.json())
            .then(data => {
                alert(data.message);
            })
            .catch(error => {
                alert("发送验证码失败");
            });
        });
    </script>
</main>
{% endblock content %}
